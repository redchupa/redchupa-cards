name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Build bundle
        run: npm run build

      - name: Verify bundle size (< 300KB gzip)
        run: |
          set -e
          BUNDLE=dist/redchupa-cards.js
          test -f "$BUNDLE" || { echo "::error::Bundle not produced at $BUNDLE"; exit 1; }
          GZIP_SIZE=$(gzip -c "$BUNDLE" | wc -c)
          LIMIT=$((300 * 1024))
          echo "Bundle gzip size: $GZIP_SIZE bytes (limit: $LIMIT)"
          if [ "$GZIP_SIZE" -gt "$LIMIT" ]; then
            echo "::error::Bundle exceeds 300KB gzip limit ($GZIP_SIZE > $LIMIT)"
            exit 1
          fi

      - name: Secret leak scan
        run: |
          set -e
          # Scan user-facing artifacts only. PLAN.md / CLAUDE.md / this workflow
          # intentionally enumerate the forbidden keywords (as a *do-not-include*
          # checklist) so excluding them is intentional, not a bypass.
          PATTERNS='192\.168\.|10\.0\.|redchupa\.com|ha\.redchupa|jerry|하린|예린|제리|WooRin|AIza[0-9A-Za-z_-]{20,}|sk-[a-zA-Z0-9]{20,}'
          if grep -rEn --include='*.ts' --include='*.js' --include='*.json' --include='*.yaml' --include='*.yml' --include='*.md' "$PATTERNS" src/ examples/ README.md hacs.json package.json 2>/dev/null; then
            echo "::error::Potential secret / personal data leak detected (see grep output above)"
            exit 1
          fi
          echo "Secret scan clean."
